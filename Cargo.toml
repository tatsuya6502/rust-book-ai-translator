[package]
name = "rust-book-translator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
regex = "1.11"
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.15"
tiktoken-rs = "0.9.1"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "fs"] }
